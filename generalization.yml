# Linux x86_64 NVIDIA GPU server; no installs or training are run by creating this file.
# conda env create -f generalization.yml
# conda activate generalization-analysis
# CUDA 12.1 runtime requires a compatible NVIDIA driver (Linux >=525.60.13).
# Script uses one GPU sequentially for the 10-member ensembles.
name: generalization-analysis
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.14.1
  - matplotlib=3.9.2
